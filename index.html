<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Management Systems 2026 Review</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#242423">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/20svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f5cb5c'/><text x='50' y='50' font-family='Segoe UI' font-size='40' font-weight='bold' fill='%23242423' text-anchor='middle' dominant-baseline='central'>BMS</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #242423;
            --surface-color: #333533;
            --primary-color: #f5cb5c;
            --primary-hover: #d4ae4b;
            --text-main: #e8eddf;
            --text-muted: #cfdbd5;
            --success-color: #10b981;
            --error-color: #ef4444;
            --border-color: #cfdbd5;
            --card-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Utility */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-4 { margin-top: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        
        /* Headers */
        h1, h2, h3 { font-weight: 700; margin-bottom: 1rem; }
        h1 { font-size: 1.75rem; color: var(--primary-color); }
        
        /* Buttons */
        .btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 52px; /* Touch target size */
            text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }
        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-outline:hover { background-color: var(--surface-color); border-color: var(--primary-color); }
        .btn-small { padding: 8px 16px; min-height: 40px; font-size: 0.9rem; }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        /* Home Screen */
        .week-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .week-item {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }
        .week-item:hover { border-color: var(--primary-color); }
        .week-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 16px;
            accent-color: var(--primary-color);
        }
        .week-item label { flex: 1; cursor: pointer; font-weight: 500; }

        /* Quiz Screen */
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--surface-color);
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-card {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: var(--card-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            animation: slideIn 0.3s ease forwards;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            min-height: 56px;
        }
        .option-btn:hover:not(:disabled) {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: var(--primary-color);
        }
        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success-color);
            color: var(--success-color);
        }
        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--error-color);
            color: var(--error-color);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        .option-btn:disabled { cursor: default; }

        /* Feedback Section */
        .feedback-section {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--primary-color);
        }
        .hint-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 10px;
            font-style: italic;
        }

        /* Stats Screen */
        .stat-card {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: var(--card-radius);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .review-item {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--success-color);
        }
        .review-item.wrong {
            border-left-color: var(--error-color);
        }
        .review-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .review-question {
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-bar">
            <h1 style="margin:0; font-size: 1.5rem;">Business Management Systems 2026 Review</h1>
            <button id="nav-stats-btn" class="btn btn-outline btn-small hidden" onclick="ui.showStats()">Stats</button>
            <button id="nav-home-btn" class="btn btn-outline btn-small hidden" onclick="ui.showHome()">Home</button>
        </div>

        <!-- SCREEN: Home -->
        <div id="screen-home" class="screen">
            <button class="btn mb-4" onclick="app.reviewAll()">Review All</button>
            <h2>Practice a selection of weeks</h2>
            <div class="mb-4">
                <button class="btn btn-outline" style="width: auto; margin-right: 10px;" onclick="app.selectAllWeeks()">Select All</button>
                <button class="btn btn-outline" style="width: auto;" onclick="app.deselectAllWeeks()">Deselect All</button>
            </div>
            <div id="week-list" class="week-list">
                <!-- Weeks generated via JS -->
            </div>
            <button class="btn" onclick="app.startQuiz()">Start Selected</button>
            
            <div id="install-container" class="hidden mt-4">
                <button id="install-btn" class="btn" style="background-color: var(--success-color);">📱 Install App to Home Screen</button>
            </div>
        </div>

        <!-- SCREEN: Quiz -->
        <div id="screen-quiz" class="screen hidden" style="padding-bottom: 70vh;">
            <div class="progress-bar">
                <div id="quiz-progress" class="progress-fill"></div>
            </div>
            
            <div class="review-meta mb-4" id="quiz-meta" style="justify-content: space-between;">
                <!-- Week Name | Question N of Total -->
            </div>

            <div class="question-card" id="question-card">
                <div id="quiz-question" class="question-text">Loading question...</div>
                <div id="quiz-options" class="options-list mb-4">
                    <!-- Options generated via JS -->
                </div>
                
                <div id="hint-area" class="hidden mb-4">
                    <button class="btn btn-outline btn-small" style="width: 100%;" onclick="document.getElementById('hint-text').classList.toggle('hidden')">💡 Show Hint</button>
                    <div id="hint-text" class="hint-text hidden mt-2"></div>
                </div>
                
                <button class="btn" id="next-btn" onclick="app.nextQuestion()" disabled>Next Question ➡️</button>
            </div>
        </div>

        <!-- SCREEN: Stats & Review -->
        <div id="screen-stats" class="screen hidden">
            <h2>Your Performance</h2>
            <div class="stat-card">
                <div>
                    <div style="color: var(--text-muted); font-size: 0.9rem;">Overall Accuracy</div>
                    <div id="stat-accuracy" class="stat-value">0%</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--text-muted); font-size: 0.9rem;">Questions Answered</div>
                    <div id="stat-total" style="font-size: 1.5rem; font-weight: 600;">0</div>
                </div>
            </div>

            <div id="stats-pdfs" class="mb-4">
                <button class="btn btn-outline" style="width: 100%; text-align: left;" onclick="document.getElementById('pdf-list').classList.toggle('hidden')">Review Content (PDFs)</button>
                <div id="pdf-list" class="hidden mt-4" style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Populated via JS -->
                </div>
            </div>

            <h3 class="mt-4">Review History</h3>
            <div class="mb-4">
                <select id="stats-filter" class="btn btn-outline" style="width: 100%; text-align: left;" onchange="app.renderStats()">
                    <option value="all">All Weeks</option>
                    <!-- Populated via JS -->
                </select>
            </div>
            
            <div id="review-list" class="review-list">
                <!-- Review items generated via JS -->
            </div>
        </div>
    </div>

    <!-- Data Import -->
    <script src="data.js"></script>
    <script src="week1.js"></script>
    <script src="week2.js"></script>
    <script src="week3.js"></script>
    <script src="week4.js"></script>
    <script src="week5.js"></script>
    <script src="week7.js"></script>
    <script src="week8.js"></script>
    <script src="week9.js"></script>
    <script src="week10.js"></script>

    <!-- App Logic -->
    <script>
        const ui = {
            screens: ['home', 'quiz', 'stats'],
            showScreen(id) {
                this.screens.forEach(s => document.getElementById(`screen-${s}`).classList.add('hidden'));
                document.getElementById(`screen-${id}`).classList.remove('hidden');
                
                // Nav buttons
                document.getElementById('nav-stats-btn').classList.toggle('hidden', id === 'stats');
                document.getElementById('nav-home-btn').classList.toggle('hidden', id === 'home');
            },
            showHome() { this.showScreen('home'); },
            showStats() { app.renderStats(); this.showScreen('stats'); }
        };

        const app = {
            state: {
                selectedWeeks: [],
                queue: [], // Remaining questions
                history: [], // For stats: { qId, correct, weekId }
                currentQ: null,
                answeredCurrent: false
            },

            init() {
                if (typeof quizData === 'undefined') {
                    document.getElementById('week-list').innerHTML = `<div style="color: red;">Error: data.js not found. Please ensure data.js exists in the same folder.</div>`;
                    return;
                }
                this.renderWeekList();
            },

            renderWeekList() {
                const list = document.getElementById('week-list');
                const filter = document.getElementById('stats-filter');
                const pdfList = document.getElementById('pdf-list');
                list.innerHTML = '';
                if(pdfList) pdfList.innerHTML = '';
                
                quizData.weeks.forEach(week => {
                    // Home checkboxes
                    const div = document.createElement('div');
                    div.className = 'week-item';
                    div.innerHTML = `
                        <input type="checkbox" id="week-${week.id}" value="${week.id}" checked>
                        <label for="week-${week.id}">${week.name}</label>
                    `;
                    list.appendChild(div);

                    // Stats filter options
                    const opt = document.createElement('option');
                    opt.value = week.id;
                    opt.textContent = week.name;
                    filter.appendChild(opt);

                    // Stats PDF list
                    if (week.pdf && pdfList) {
                        const pdfLink = document.createElement('a');
                        pdfLink.href = week.pdf;
                        pdfLink.target = "_blank";
                        pdfLink.className = "btn btn-outline btn-small";
                        pdfLink.style.justifyContent = "flex-start";
                        pdfLink.textContent = week.name;
                        pdfList.appendChild(pdfLink);
                    }
                });
            },

            selectAllWeeks() {
                document.querySelectorAll('.week-item input[type="checkbox"]').forEach(cb => cb.checked = true);
            },
            
            deselectAllWeeks() {
                document.querySelectorAll('.week-item input[type="checkbox"]').forEach(cb => cb.checked = false);
            },

            reviewAll() {
                this.selectAllWeeks();
                this.startQuiz();
            },

            startQuiz() {
                const checkboxes = document.querySelectorAll('.week-item input[type="checkbox"]:checked');
                this.state.selectedWeeks = Array.from(checkboxes).map(cb => parseInt(cb.value));
                
                if (this.state.selectedWeeks.length === 0) {
                    alert('Please select at least one week to practice.');
                    return;
                }

                // Filter questions
                let questions = quizData.questions.filter(q => this.state.selectedWeeks.includes(q.weekId));
                if (questions.length === 0) {
                    alert('No questions found for the selected weeks in data.js.');
                    return;
                }

                // Shuffle array (Fisher-Yates)
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                
                this.state.queue = [...questions];
                ui.showScreen('quiz');
                this.nextQuestion(true);
            },

            nextQuestion(isFirst = false) {
                if (this.state.queue.length === 0) {
                    alert('Quiz complete! All selected questions answered.');
                    ui.showStats();
                    return;
                }

                this.state.answeredCurrent = false;
                const q = this.state.queue.shift();
                this.state.currentQ = q;

                const weekInfo = quizData.weeks.find(w => w.id === q.weekId);

                // Update UI
                document.getElementById('quiz-meta').innerHTML = `
                    <span>${weekInfo ? weekInfo.name : 'Unknown Week'}</span>
                    <span style="color: var(--text-muted);">${this.state.queue.length} remaining</span>
                `;
                
                // Animate card
                const card = document.getElementById('question-card');
                card.style.animation = 'none';
                card.offsetHeight; /* trigger reflow */
                card.style.animation = null;

                document.getElementById('quiz-question').textContent = q.question;
                
                // Render Options
                const optsContainer = document.getElementById('quiz-options');
                optsContainer.innerHTML = '';
                q.options.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = optText;
                    btn.onclick = () => this.handleAnswer(index, btn);
                    optsContainer.appendChild(btn);
                });

                // Reset feedback area
                const nextBtn = document.getElementById('next-btn');
                nextBtn.disabled = true;
                
                document.getElementById('hint-area').classList.add('hidden');
                document.getElementById('hint-text').classList.add('hidden');
                
                // Hint logic prep
                let displayHint = null;
                if (q.hintId && quizData.hints[q.hintId]) {
                    displayHint = quizData.hints[q.hintId];
                } else if (q.hint) {
                    displayHint = quizData.hints[q.hint] || q.hint;
                }

                if (displayHint) {
                    document.getElementById('hint-area').classList.remove('hidden');
                    document.getElementById('hint-text').textContent = displayHint;
                }

                // Scroll the page so the week info is at the top
                setTimeout(() => {
                    const metaInfo = document.getElementById('quiz-meta');
                    if (metaInfo) {
                        metaInfo.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 50);
            },

            handleAnswer(selectedIndex, btnElement) {
                if (this.state.answeredCurrent) return;
                this.state.answeredCurrent = true;

                const q = this.state.currentQ;
                const isCorrect = selectedIndex === q.correctIndex;

                // Disable all buttons, highlight correct/incorrect
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach((btn, idx) => {
                    btn.disabled = true;
                    if (idx === q.correctIndex) {
                        btn.classList.add('correct');
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.classList.add('incorrect');
                    }
                });

                // Record history
                this.state.history.push({
                    qId: q.id,
                    weekId: q.weekId,
                    correct: isCorrect,
                    selectedIndex: selectedIndex,
                    timestamp: Date.now()
                });

                // Show feedback
                const nextBtn = document.getElementById('next-btn');
                nextBtn.disabled = false;

                if (!isCorrect) {
                    // Re-insert 10 questions ahead, or at end if < 10
                    const insertIndex = Math.min(10, this.state.queue.length);
                    this.state.queue.splice(insertIndex, 0, q);
                }
            },

            renderStats() {
                const filterVal = document.getElementById('stats-filter').value;
                const list = document.getElementById('review-list');
                list.innerHTML = '';

                // Overall Accuracy Calculation based on history
                const totalAnswers = this.state.history.length;
                const correctAnswers = this.state.history.filter(h => h.correct).length;
                const acc = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;

                document.getElementById('stat-accuracy').textContent = `${acc}%`;
                document.getElementById('stat-total').textContent = totalAnswers;

                // Render list based on all questions
                let relevantQuestions = [...quizData.questions];
                if (filterVal !== 'all') {
                    relevantQuestions = relevantQuestions.filter(q => q.weekId === parseInt(filterVal));
                }

                if (relevantQuestions.length === 0) {
                    list.innerHTML = '<div style="color: var(--text-muted); text-align: center;">No questions found.</div>';
                    return;
                }

                // Calculate stats for ordering (most wrong answers at top)
                const qStats = relevantQuestions.map(q => {
                    const qHistory = this.state.history.filter(h => h.qId === q.id);
                    const wrongCount = qHistory.filter(h => !h.correct).length;
                    return { q, qHistory, wrongCount };
                });

                // Sort: Most wrong first
                qStats.sort((a, b) => b.wrongCount - a.wrongCount);

                qStats.forEach(({ q, qHistory, wrongCount }) => {
                    const weekInfo = quizData.weeks.find(w => w.id === q.weekId);
                    
                    // Count how many times each option was answered
                    const optionCounts = new Array(q.options.length).fill(0);
                    qHistory.forEach(h => {
                        if(h.selectedIndex !== undefined && h.selectedIndex >= 0) {
                            optionCounts[h.selectedIndex]++;
                        }
                    });

                    const div = document.createElement('div');
                    div.className = `review-item`;
                    
                    // Build options HTML
                    let optionsHtml = '<div class="mt-4" style="display: flex; flex-direction: column; gap: 8px;">';
                    q.options.forEach((opt, oIdx) => {
                        const isCorrect = oIdx === q.correctIndex;
                        const count = optionCounts[oIdx];
                        const styleColor = isCorrect ? 'color: var(--success-color);' : 'color: var(--text-muted);';
                        optionsHtml += `
                            <div style="background-color: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; font-size: 0.9rem; display: flex; justify-content: space-between;">
                                <span style="${styleColor}">${opt} ${isCorrect ? '(Correct)' : ''}</span>
                                <span>${count} times</span>
                            </div>
                        `;
                    });
                    optionsHtml += '</div>';

                    // Hint HTML
                    let hintHtml = '';
                    let displayHint = null;
                    if (q.hintId && quizData.hints[q.hintId]) {
                        displayHint = quizData.hints[q.hintId];
                    } else if (q.hint) {
                        displayHint = quizData.hints[q.hint] || q.hint;
                    }

                    if (displayHint) {
                        hintHtml = `
                            <div class="mt-4">
                                <button class="btn btn-outline btn-small" onclick="document.getElementById('stats-hint-${q.id}').classList.toggle('hidden')">💡 Show Hint</button>
                                <div id="stats-hint-${q.id}" class="hint-text hidden mt-2">${displayHint}</div>
                            </div>
                        `;
                    }

                    div.innerHTML = `
                        <div class="review-meta">
                            <span>${weekInfo ? weekInfo.name : 'Unknown Week'}</span>
                            <span style="color: var(--text-muted);">Answered: ${qHistory.length}</span>
                        </div>
                        <div class="review-question" style="cursor: pointer;" onclick="document.getElementById('stats-details-${q.id}').classList.toggle('hidden')">
                            ${q.question}
                            <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">
                                <strong>Answer:</strong> ${q.options[q.correctIndex]}
                                <span style="float: right; font-size: 0.8rem;">Tap to expand ▼</span>
                            </div>
                        </div>
                        <div id="stats-details-${q.id}" class="hidden">
                            ${optionsHtml}
                            ${hintHtml}
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

        };

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installContainer = document.getElementById('install-container');
            if (installContainer) installContainer.classList.remove('hidden');
        });

        document.getElementById('install-btn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                const installContainer = document.getElementById('install-container');
                if (installContainer) installContainer.classList.add('hidden');
            }
        });

        // Initialize app on load
        window.onload = () => {
            app.init();
        };

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
